<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hometown</title>

    <link rel="stylesheet" href="./dist/output.css">

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="bg-[#F8E5D7] text-[#65232B] min-h-screen flex flex-col">

    <nav class="bg-[#ECAAB2] p-4">
        <div class="flex justify-center gap-6">
            <a href="/quiz1" class="px-4 py-2 rounded-lg hover:bg-[#D88F99] transition">Home</a>
            <a href="/quiz1/profile" class="px-4 py-2 rounded-lg hover:bg-[#D88F99] transition">Profile</a>
            <a href="/quiz1/hometown" class="px-4 py-2 rounded-lg hover:bg-[#D88F99] transition">Hometown</a>
            <a href="/quiz1/food" class="px-4 py-2 rounded-lg hover:bg-[#D88F99] transition">Local Food</a>
            <a href="/quiz1/tourist" class="px-4 py-2 rounded-lg hover:bg-[#D88F99] transition">Tourist Places</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto text-center p-10 flex-1">

        <h1 class="text-4xl font-bold text-[#432720] mb-4">
            My Hometown
        </h1>

        <div id="carousel" data-slides='[
                {"image": "/images/hometown1.jpeg"},
                {"image": "/images/hometown2.jpeg"},
                {"image": "/images/hometown3.jpeg"}]'
            class="relative max-w-xl mx-auto"
        >

            <img
                id="carousel_image"
                src="/images/hometown1.jpeg"
                alt="hometown"
                class="w-full h-72 md:h-150 object-cover shadow-lg rounded-lg transition-opacity duration-200"
            >

            <button
                id="prev_button"
                class="absolute left-3 top-1/2 -translate-y-1/2
                       bg-[#65232B]/50 hover:bg-[#65232B]/80
                       text-white text-2xl
                       w-10 h-10 rounded-full"
            >
                &#10094;
            </button>

            <button
                id="next_button"
                class="absolute right-3 top-1/2 -translate-y-1/2
                    bg-[#65232B]/50 hover:bg-[#65232B]/80
                    text-white text-2xl
                    w-10 h-10 rounded-full"
            >
                &#10095;
            </button>

        </div>

        <div id="indicator" class="mt-4 text-gray-600">
            1 / 3
        </div>

        <br>

        <div class="text-[#F8E5D7] bg-[#65232B] p-6 rounded-lg shadow">
            <h2 class="text-2xl font-bold mb-3">
                Yogyakarta
            </h2>

            <p>
                Considered as a touristy city with many destinations, but what makes jogja my hometown is truly all the people i met there and the memories we created together ♡
            </p>
        </div>

    </main>

<script src="/script.js"></script>

        <footer class= "bg-[#65232B] text-[#F8E5D7] text-center p-2 mt-10">

        <p class="mb-2">
            More about me 𖹭
        </p>

        <div class="flex justify-center gap-7 text-2xl">

            <a
                href="https://www.instagram.com/mndptrc"
                target="_blank"
                rel="noopener noreferrer"
                class="hover:text-[#ECAAB2]"
            >
                <i class="fa-brands fa-instagram"></i>
            </a>

            <a
                href="https://github.com/coeyr"
                target="_blank"
                rel="noopener noreferrer"
                class="hover:text-[#ECAAB2]"
            >
                <i class="fa-brands fa-github"></i>
            </a>

            <a
                href="https://www.linkedin.com/in/amandachae"
                target="_blank"
                rel="noopener noreferrer"
                class="hover:text-[#ECAAB2]"
            >
                <i class="fa-brands fa-linkedin"></i>
            </a>

        </div>

    </footer>

</body>

</html>
